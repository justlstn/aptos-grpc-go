version: v2
clean: false
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/justlstn/aptos-grpc-go
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc # Add this plugin!
    out: .
    opt:
      - paths=source_relative
inputs:
  - directory: protos/proto
